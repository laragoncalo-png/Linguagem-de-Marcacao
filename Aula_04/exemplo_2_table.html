<html lang="pt-br">
	<head>

		<title>Exemplo 2 - Table</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color: white">

				<td style="background-color:#000;color:#FFF;">Conteudo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: yellow;">1</td>
							<td style="background-color: red; color:#FFF; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color: blue; color:#FFF; text-align:right;">3</td>
							<td style="background-color: green;">4</td>

				</td>

			</tr>
			<tr>
				<td style="background-color:#000;color:#FFF; ">Conteudo 4</td>
				<td style="background-image:url('https://acdn-us.mitiendanube.com/stores/438/755/products/ppdch49-58x58cm1-49a7246ce29c28eac015710748612874-480-0.webp'); text-align:right;">Conteudo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: orange;">5</td>
							<td style="background-color: pink; color:#000; text-align:right;">6</td>
						</tr>
						<tr>
							<td style="background-color: red; color:#000; text-align:right;">7</td>
							<td style="background-color: orange;">8</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
